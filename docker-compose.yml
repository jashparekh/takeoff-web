# Local services for development. `docker compose up -d`, then copy .env.example to .env.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: takeoff, POSTGRES_PASSWORD: takeoff, POSTGRES_DB: takeoff }
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "takeoff"], interval: 2s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: takeoff, MINIO_ROOT_PASSWORD: takeoff-dev-only }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
volumes:
  db:
  minio:
