# Local services for development. `docker compose up -d`, then copy .env.example to .env.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: takeoff, POSTGRES_PASSWORD: takeoff, POSTGRES_DB: takeoff }
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "takeoff"], interval: 2s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # S3-compatible stand-in for DigitalOcean Spaces (MinIO no longer publishes images). Accepts any key/secret.
  s3:
    image: adobe/s3mock:4.7.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: takeoff-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["9000:9090"]
    volumes: [s3:/data]
volumes:
  db:
  s3:
