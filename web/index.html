<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takeoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C2410C'/%3E%3Cpath d='M7 22h18M7 10h18M10 10v12M22 10v12' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#projects"><span class="logo" aria-hidden="true"></span>Takeoff</a>
    <div class="proj" id="projName" hidden></div>
    <nav id="nav">
      <a href="#overview" data-v="overview">Overview</a>
      <a href="#model" data-v="model">3D model</a>
      <a href="#drawings" data-v="drawings">Drawings</a>
      <a href="#beams" data-v="beams">Beams</a>
      <a href="#slab" data-v="slab">Slab</a>
      <a href="#issues" data-v="issues">Issues <span class="count" id="issueCount"></span></a>
      <a href="#notebook" data-v="notebook">Site check</a>
      <a href="#assumptions" data-v="assumptions">Assumptions <span class="count warn" id="ovrCount" hidden></span></a>
      <a href="#upload" data-v="upload">Add drawings</a>
      <a href="#review" data-v="review">Review <span class="count warn" id="reviewCount" hidden></span></a>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
