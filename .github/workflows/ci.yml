name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests 2>&1 | tee test.log
      - run: docker build -t takeoff-web . 2>&1 | tail -150 > build.log
      - name: Post log on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = ['test.log', 'build.log'].filter(f => fs.existsSync(f)).map(f => fs.readFileSync(f, 'utf8').split('\n').slice(-150).join('\n')).join('\n---\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: '### CI failed\n```\n' + log + '\n```' });
