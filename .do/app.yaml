name: takeoff-web
region: blr
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: jashparekh/takeoff-web
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
